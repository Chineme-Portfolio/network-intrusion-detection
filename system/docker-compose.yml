# Caught — local dev topology (Layer 0).
#
# `docker compose up` from system/ starts Redis plus the four service skeletons.
# At Layer 0 only the ml-service serves a real endpoint (GET /health, AC-1);
# capture, backend, and frontend boot into the topology as skeletons so the real
# shape exists from the first slice (foundation.md Section 9, Section 7 #10).
#
# Secrets and config come from the environment only (code-standards.md Section 6):
# copy .env.example to .env to override any default below. Nothing is persisted
# this phase (foundation.md Section 8), so up/down is stateless.

services:
  redis:
    image: redis:7-alpine
    # Not published to the host: only the services on this compose network reach
    # the pub/sub spine (at redis:6379). Internal-only avoids host port clashes
    # and keeps Redis off the host surface (code-standards.md Section 6). To poke
    # it directly in dev: `docker compose exec redis redis-cli`.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ml-service:
    build: ./ml-service
    # Host ports are parameterized (override in .env) so the topology comes up
    # even when a host port is already taken by another project.
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    environment:
      # The pub/sub spine. Consumed from the keystone (K1) on; /health never
      # touches it, so the skeleton is healthy before there is anything to serve.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  capture:
    build: ./capture
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build: ./backend
    # Default host port 3001 (3000 is a common dev-server port; override in .env).
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Where control actions proxy to (from K1); harmless at Layer 0.
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # The browser reaches the backend (never the ml-service or Redis directly,
      # architecture.md Boundaries). Wired in K1/F2.
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_started
