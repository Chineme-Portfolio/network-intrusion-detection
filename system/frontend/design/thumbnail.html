<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:854px;width:1280px;overflow:hidden}
.wrap{display:grid;grid-template-columns:1fr 300px;height:854px}
.mark{display:flex;align-items:center;justify-content:center;background:var(--ink-900);background-image:var(--pattern-grid)}
.mark span{font-family:var(--font-sans);font-weight:600;font-size:210px;letter-spacing:-.03em;color:var(--steel-100);line-height:1}
.mark span i{font-style:normal;display:inline-block;width:.13em;height:.13em;background:var(--cyan-500);margin-bottom:.05em}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style></head>
<body><div class="wrap">
<div class="mark"><span>Caught<i></i></span></div>
<div class="strip"><div style="background:#e0b23f"></div><div style="background:#4fafbc"></div><div style="background:#e4572e"></div><div style="background:#8e3018"></div></div>
</div></body></html>
