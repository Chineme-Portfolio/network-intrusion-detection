<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:6px;border-radius:var(--radius-sm);border:1px solid rgba(202,214,227,.10)}.tok{font-family:var(--font-mono);font-size:10px;letter-spacing:.005em;line-height:1.35}.hex{font-family:var(--font-mono);font-size:9px;opacity:.62;line-height:1.35}.lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}.note{font-size:11px;color:var(--text-faint);line-height:1.4}</style></head><body><div class="sw"><div style="background:var(--amber-300);color:var(--ink-1000)"><span class="tok">--amber-300</span><span class="hex">#f0d485</span></div><div style="background:var(--amber-400);color:var(--ink-1000)"><span class="tok">--amber-400</span><span class="hex">#e0b23f</span></div><div style="background:var(--amber-700);color:var(--steel-100)"><span class="tok">--amber-700</span><span class="hex">#7a5c16</span></div><div style="background:var(--amber-900);color:var(--steel-100)"><span class="tok">--amber-900</span><span class="hex">#2e240b</span></div></div><p class="note" style="margin:10px 0 0">Amber carries every warning and error state, because vermilion is spoken for. Form errors, buffer pressure and "drop source" all read amber.</p></body></html>
