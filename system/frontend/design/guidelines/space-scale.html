<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.005em}.note{font-size:11px;color:var(--text-faint);line-height:1.45}.row{display:flex;align-items:baseline;gap:14px}.g{display:flex;align-items:flex-end;gap:10px}.b{display:flex;flex-direction:column;align-items:center;gap:6px}.bar{background:var(--cyan-700);border-top:1px solid var(--cyan-500);width:100%}</style></head><body><div class="g"><div class="b" style="width:10px"><div class="bar" style="height:2px"></div><span class="tok">2</span></div><div class="b" style="width:12px"><div class="bar" style="height:4px"></div><span class="tok">4</span></div><div class="b" style="width:14px"><div class="bar" style="height:6px"></div><span class="tok">6</span></div><div class="b" style="width:16px"><div class="bar" style="height:8px"></div><span class="tok">8</span></div><div class="b" style="width:18px"><div class="bar" style="height:10px"></div><span class="tok">10</span></div><div class="b" style="width:20px"><div class="bar" style="height:12px"></div><span class="tok">12</span></div><div class="b" style="width:24px"><div class="bar" style="height:16px"></div><span class="tok">16</span></div><div class="b" style="width:28px"><div class="bar" style="height:20px"></div><span class="tok">20</span></div><div class="b" style="width:32px"><div class="bar" style="height:24px"></div><span class="tok">24</span></div><div class="b" style="width:40px"><div class="bar" style="height:32px"></div><span class="tok">32</span></div><div class="b" style="width:48px"><div class="bar" style="height:40px"></div><span class="tok">40</span></div><div class="b" style="width:56px"><div class="bar" style="height:48px"></div><span class="tok">48</span></div><div class="b" style="width:72px"><div class="bar" style="height:64px"></div><span class="tok">64</span></div></div><p class="note" style="margin:12px 0 0">4 inside a chip &middot; 8 between related controls &middot; 12 panel padding &middot; 16 between panels &middot; 24+ only in marketing or empty states.</p></body></html>
