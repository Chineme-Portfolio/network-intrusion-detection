<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="Motion reports, it does not perform. Nothing bounces, nothing scales." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.005em}.note{font-size:11px;color:var(--text-faint);line-height:1.45}.g{display:flex;flex-direction:column;gap:8px}.l{display:flex;align-items:center;gap:12px}.track{position:relative;flex:1;height:6px;background:var(--ink-750);border-radius:1px;overflow:hidden}.sw{position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--cyan-500),transparent)}.n{font-size:11px;color:var(--text-secondary);width:150px}</style></head><body><div class="g"><div class="l"><span class="n">Hover, press, toggle</span><div class="track"><div class="sw" style="animation:caught-sweep 140ms var(--ease-out) infinite"></div></div><span class="tok">--dur-fast 140ms</span></div><div class="l"><span class="n">Panel, drawer, dialog</span><div class="track"><div class="sw" style="animation:caught-sweep 220ms var(--ease-out) infinite"></div></div><span class="tok">--dur-base 220ms</span></div><div class="l"><span class="n">New row settling in</span><div class="track"><div class="sw" style="animation:caught-sweep 400ms var(--ease-out) infinite"></div></div><span class="tok">--dur-slow 400ms</span></div></div><p class="note" style="margin:12px 0 0">Easing is <span class="tok">--ease-out cubic-bezier(.2,.7,.3,1)</span>. A verdict never animates: it is either known or it is not.</p></body></html>
