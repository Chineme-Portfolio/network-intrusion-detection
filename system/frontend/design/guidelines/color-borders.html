<!-- @dsCard group="Colors" viewport="700x130" name="Borders & focus" subtitle="Hairline for row rules, subtle for panels, cyan for focus." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:6px;border-radius:var(--radius-sm);border:1px solid rgba(202,214,227,.10)}.tok{font-family:var(--font-mono);font-size:10px;letter-spacing:.005em;line-height:1.35}.hex{font-family:var(--font-mono);font-size:9px;opacity:.62;line-height:1.35}.lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}.note{font-size:11px;color:var(--text-faint);line-height:1.4}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.b{height:56px;border-radius:var(--radius-sm);background:var(--surface-panel);display:flex;align-items:flex-end;padding:6px}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style></head><body><div class="g"><div class="b" style="border:1px solid var(--border-hairline)"><span class="n">--border-hairline</span></div><div class="b" style="border:1px solid var(--border-subtle)"><span class="n">--border-subtle</span></div><div class="b" style="border:1px solid var(--border-strong)"><span class="n">--border-strong</span></div><div class="b" style="border:1px solid var(--border-focus);box-shadow:var(--ring-focus)"><span class="n">--border-focus</span></div></div></body></html>
