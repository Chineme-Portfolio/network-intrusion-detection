<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:6px;border-radius:var(--radius-sm);border:1px solid rgba(202,214,227,.10)}.tok{font-family:var(--font-mono);font-size:10px;letter-spacing:.005em;line-height:1.35}.hex{font-family:var(--font-mono);font-size:9px;opacity:.62;line-height:1.35}.lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}.note{font-size:11px;color:var(--text-faint);line-height:1.4}</style></head><body><div class="sw"><div style="background:var(--cyan-300);color:var(--ink-1000)"><span class="tok">--cyan-300</span><span class="hex">#8fd6de</span></div><div style="background:var(--cyan-400);color:var(--ink-1000)"><span class="tok">--cyan-400</span><span class="hex">#6cc5d0</span></div><div style="background:var(--cyan-500);color:var(--ink-1000)"><span class="tok">--cyan-500</span><span class="hex">#4fafbc</span></div><div style="background:var(--cyan-700);color:var(--steel-100)"><span class="tok">--cyan-700</span><span class="hex">#24616b</span></div><div style="background:var(--cyan-900);color:var(--steel-100)"><span class="tok">--cyan-900</span><span class="hex">#12333a</span></div></div><p class="note" style="margin:10px 0 0">500 is <span style="font-family:var(--font-mono)">--accent</span> (primary buttons, focus ring, selection edge) &middot; 400 hover and links &middot; 300 text on tinted fills.</p></body></html>
