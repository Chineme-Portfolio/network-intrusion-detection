<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.005em}.note{font-size:11px;color:var(--text-faint);line-height:1.45}.g{display:flex;gap:14px;align-items:stretch}.b{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;border:1px solid var(--border-hairline);border-radius:var(--radius-md)}.wm{font-weight:600;letter-spacing:-.03em;line-height:1;display:inline-flex;align-items:baseline;gap:3px}.dot{width:.13em;height:.13em;background:var(--cyan-500);display:inline-block;margin-bottom:.04em}</style></head><body><div class="g"><div class="b" style="background:var(--ink-950)"><span class="wm" style="font-size:40px;color:var(--steel-100)">Caught<i class="dot"></i></span></div><div class="b" style="background:var(--ink-900);background-image:var(--pattern-grid)"><span class="wm" style="font-size:24px;color:var(--steel-100)">Caught<i class="dot"></i></span></div><div class="b" style="background:var(--steel-100)"><span class="wm" style="font-size:24px;color:var(--ink-1000)">Caught<i class="dot" style="background:var(--cyan-700)"></i></span></div></div><p class="note" style="margin:10px 0 0">Minimum 14px. Never stretched, outlined, gradient-filled or set in vermilion.</p></body></html>
