<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.005em}.note{font-size:11px;color:var(--text-faint);line-height:1.45}.g{display:flex;gap:16px}.e{flex:1;height:86px;background:var(--surface-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px}</style></head><body><div class="g" style="padding:6px"><div class="e" style="box-shadow:var(--shadow-panel)"><span class="tok">--shadow-panel</span></div><div class="e" style="box-shadow:var(--shadow-overlay);border-color:var(--border-strong);border-radius:var(--radius-lg)"><span class="tok">--shadow-overlay</span></div><div class="e" style="box-shadow:var(--glow-alert);border-color:var(--verdict-malicious-border)"><span class="tok" style="color:var(--verdict-malicious-fg)">--glow-alert</span></div></div></body></html>
