<!-- @dsCard group="Colors" viewport="700x120" name="Steel — type & lines" subtitle="Ice-neutral greys. Every text colour lives here." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:6px;border-radius:var(--radius-sm);border:1px solid rgba(202,214,227,.10)}.tok{font-family:var(--font-mono);font-size:10px;letter-spacing:.005em;line-height:1.35}.hex{font-family:var(--font-mono);font-size:9px;opacity:.62;line-height:1.35}.lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}.note{font-size:11px;color:var(--text-faint);line-height:1.4}</style></head><body><div class="sw"><div style="background:var(--steel-100);color:var(--ink-1000)"><span class="tok">--steel-100</span><span class="hex">#eaf0f7</span></div><div style="background:var(--steel-200);color:var(--ink-1000)"><span class="tok">--steel-200</span><span class="hex">#cbd6e3</span></div><div style="background:var(--steel-300);color:var(--ink-1000)"><span class="tok">--steel-300</span><span class="hex">#a6b4c6</span></div><div style="background:var(--steel-400);color:var(--ink-1000)"><span class="tok">--steel-400</span><span class="hex">#8494a9</span></div><div style="background:var(--steel-500);color:var(--steel-100)"><span class="tok">--steel-500</span><span class="hex">#65758c</span></div><div style="background:var(--steel-600);color:var(--steel-100)"><span class="tok">--steel-600</span><span class="hex">#4c5b70</span></div></div></body></html>
