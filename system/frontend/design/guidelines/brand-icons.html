<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.005em}.note{font-size:11px;color:var(--text-faint);line-height:1.45}.g{display:grid;grid-template-columns:repeat(10,1fr);gap:12px 8px}.i{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-secondary)}</style></head><body>
<div class="g"><div class="i" data-icon="shield-alert"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">shield-alert</span></div><div class="i" data-icon="shield-check"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">shield-check</span></div><div class="i" data-icon="shield-off"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">shield-off</span></div><div class="i" data-icon="activity"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">activity</span></div><div class="i" data-icon="radar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">radar</span></div><div class="i" data-icon="network"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">network</span></div><div class="i" data-icon="server"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">server</span></div><div class="i" data-icon="cpu"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">cpu</span></div><div class="i" data-icon="database"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">database</span></div><div class="i" data-icon="route"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">route</span></div><div class="i" data-icon="scan-line"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">scan-line</span></div><div class="i" data-icon="gauge"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">gauge</span></div><div class="i" data-icon="list-filter"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">list-filter</span></div><div class="i" data-icon="search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">search</span></div><div class="i" data-icon="pause"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">pause</span></div><div class="i" data-icon="play"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">play</span></div><div class="i" data-icon="eye"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">eye</span></div><div class="i" data-icon="clock"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">clock</span></div><div class="i" data-icon="triangle-alert"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">triangle-alert</span></div><div class="i" data-icon="circle-alert"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="tok">circle-alert</span></div></div>
<p class="note" style="margin:12px 0 0">50 glyphs ship in <span class="tok">assets/icons/</span>. Add missing ones from Lucide rather than inlining paths. No emoji, no unicode symbols as icons.</p>
<script>document.querySelectorAll(".i").forEach(async (el)=>{const r=await fetch("../assets/icons/"+el.dataset.icon+".svg");if(!r.ok)return;const t=await r.text();el.querySelector("svg").innerHTML=t.replace(/<svg[^>]*>/,"").replace(/<\/svg>\s*$/,"");});</script>
</body></html>
