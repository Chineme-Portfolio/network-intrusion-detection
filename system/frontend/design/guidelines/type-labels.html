<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.005em}.note{font-size:11px;color:var(--text-faint);line-height:1.45}.row{display:flex;align-items:baseline;gap:14px}.g{display:flex;gap:24px;flex-wrap:wrap}.k{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="g"><span class="k">Source</span><span class="k">Destination</span><span class="k">Proto</span><span class="k">Verdict</span><span class="k">Confidence</span><span class="k">Flows / sec</span><span class="k">Stream</span></div><p class="note" style="margin:12px 0 0">Never longer than three words, never sentence case, never below 10px. Micro labels name a value; they never carry meaning of their own.</p></body></html>
