<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.005em}.note{font-size:11px;color:var(--text-faint);line-height:1.45}.row{display:flex;align-items:baseline;gap:14px}.g{display:flex;gap:14px;align-items:flex-start}.c{display:flex;flex-direction:column;gap:6px}.ctl{display:flex;align-items:center;padding:0 10px;background:var(--surface-control);border:1px solid var(--border-control);border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--text-body)}.tr{display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--border-hairline);font-family:var(--font-mono);font-size:11px;color:var(--text-body)}</style></head><body><div class="g"><div class="c" style="width:210px"><div class="ctl" style="height:var(--control-h-sm)">sm 22 <span class="tok" style="margin-left:auto">--control-h-sm</span></div><div class="ctl" style="height:var(--control-h-md)">md 28 <span class="tok" style="margin-left:auto">--control-h-md</span></div><div class="ctl" style="height:var(--control-h-lg)">lg 34 <span class="tok" style="margin-left:auto">--control-h-lg</span></div></div><div style="flex:1;background:var(--surface-panel);border:1px solid var(--border-hairline);border-radius:var(--radius-md);overflow:hidden"><div class="tr" style="height:var(--row-h-dense)">26 &nbsp; dense &mdash; 40+ visible rows<span class="tok" style="margin-left:auto">--row-h-dense</span></div><div class="tr" style="height:var(--row-h)">30 &nbsp; default flow row<span class="tok" style="margin-left:auto">--row-h</span></div><div class="tr" style="height:var(--row-h-comfy);border:0">36 &nbsp; comfortable<span class="tok" style="margin-left:auto">--row-h-comfy</span></div></div></div></body></html>
