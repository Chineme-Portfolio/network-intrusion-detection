<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:6px;border-radius:var(--radius-sm);border:1px solid rgba(202,214,227,.10)}.tok{font-family:var(--font-mono);font-size:10px;letter-spacing:.005em;line-height:1.35}.hex{font-family:var(--font-mono);font-size:9px;opacity:.62;line-height:1.35}.lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}.note{font-size:11px;color:var(--text-faint);line-height:1.4}</style></head><body><div class="sw"><div style="background:var(--ink-1000);color:var(--steel-100)"><span class="tok">--ink-1000</span><span class="hex">#04070d</span></div><div style="background:var(--ink-950);color:var(--steel-100)"><span class="tok">--ink-950</span><span class="hex">#070b13</span></div><div style="background:var(--ink-900);color:var(--steel-100)"><span class="tok">--ink-900</span><span class="hex">#0a0f1a</span></div><div style="background:var(--ink-850);color:var(--steel-100)"><span class="tok">--ink-850</span><span class="hex">#0d1420</span></div><div style="background:var(--ink-800);color:var(--steel-100)"><span class="tok">--ink-800</span><span class="hex">#121a28</span></div><div style="background:var(--ink-750);color:var(--steel-100)"><span class="tok">--ink-750</span><span class="hex">#172130</span></div><div style="background:var(--ink-700);color:var(--steel-100)"><span class="tok">--ink-700</span><span class="hex">#1d2838</span></div><div style="background:var(--ink-650);color:var(--steel-100)"><span class="tok">--ink-650</span><span class="hex">#243044</span></div><div style="background:var(--ink-600);color:var(--steel-100)"><span class="tok">--ink-600</span><span class="hex">#2c3a50</span></div><div style="background:var(--ink-500);color:var(--steel-100)"><span class="tok">--ink-500</span><span class="hex">#3c4c64</span></div></div></body></html>
