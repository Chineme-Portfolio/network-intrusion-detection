<!-- @dsCard group="Colors" viewport="700x140" name="Alert vermilion" subtitle="Malicious verdicts only. Never a button, never an error, never a chart series." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:6px}.sw>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:74px;padding:6px;border-radius:var(--radius-sm);border:1px solid rgba(202,214,227,.10)}.tok{font-family:var(--font-mono);font-size:10px;letter-spacing:.005em;line-height:1.35}.hex{font-family:var(--font-mono);font-size:9px;opacity:.62;line-height:1.35}.lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}.note{font-size:11px;color:var(--text-faint);line-height:1.4}</style></head><body><div class="sw"><div style="background:var(--vermilion-300);color:var(--ink-1000)"><span class="tok">--vermilion-300</span><span class="hex">#f79475</span></div><div style="background:var(--vermilion-400);color:var(--ink-1000)"><span class="tok">--vermilion-400</span><span class="hex">#f26b41</span></div><div style="background:var(--vermilion-500);color:var(--ink-1000)"><span class="tok">--vermilion-500</span><span class="hex">#e4572e</span></div><div style="background:var(--vermilion-700);color:var(--steel-100)"><span class="tok">--vermilion-700</span><span class="hex">#8e3018</span></div><div style="background:var(--vermilion-900);color:var(--steel-100)"><span class="tok">--vermilion-900</span><span class="hex">#3d170d</span></div></div><p class="note" style="margin:10px 0 0">300 for text on dark &middot; 500 for fills, left row edges and the hero chip &middot; 700/900 for borders and tinted backgrounds.</p></body></html>
