<!-- @dsCard group="Components" viewport="700x230" name="Core controls" subtitle="Button, IconButton, Input, Select, Checkbox, Radio, Switch" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-app);padding:14px}#root{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint);margin-bottom:8px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {Button,IconButton,Input,Select,Checkbox,Radio,Switch} = window.CaughtDesignSystem_eb3eb1;
function Demo(){const [c,setC]=React.useState(true);const [s,setS]=React.useState(true);const [r,setR]=React.useState("live");const [m,setM]=React.useState("rf-v4");return (<>
<div><div className="lbl">Buttons</div><div className="row">
<Button variant="primary" icon="play">Resume capture</Button>
<Button icon="download">Export</Button>
<Button variant="ghost" iconEnd="chevron-down">Last 15m</Button>
<Button variant="caution" icon="ban">Drop source</Button>
<Button disabled>Disabled</Button>
<Button size="sm" icon="list-filter" active>Filters</Button>
<IconButton icon="pause" label="Pause"/><IconButton icon="settings" label="Settings" active/><IconButton icon="x" label="Close" variant="secondary"/><IconButton icon="check" label="Confirm" variant="solid"/>
</div></div>
<div><div className="lbl">Fields</div><div className="row" style={{alignItems:"flex-end"}}>
<Input icon="search" placeholder="proto=TCP and dst_port=445" mono wrapperStyle={{width:240}} fullWidth/>
<Input label="Threshold" defaultValue="0.85" suffix="conf" size="sm" wrapperStyle={{width:110}} fullWidth/>
<Select label="Model" mono value={m} onChange={setM} options={["rf-v4","xgb-v2","mlp-v1","knn-v3","svm-v1"]}/>
<Input label="Invalid" mono invalid defaultValue="port=" hint="Missing value" wrapperStyle={{width:130}} fullWidth/>
</div></div>
<div className="row" style={{gap:20}}>
<Checkbox label="Show benign" checked={c} onChange={setC}/><Checkbox label="Mixed" indeterminate/><Checkbox label="Disabled" disabled/>
<Radio name="src" label="Live" checked={r==="live"} onChange={()=>setR("live")}/><Radio name="src" label="Replay" checked={r==="replay"} onChange={()=>setR("replay")}/>
<Switch label="Auto-scroll" checked={s} onChange={setS}/><Switch label="Mute" size="sm" checked={false} onChange={()=>{}}/>
</div></>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
